name: Publish FM1 V-Station RC

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-vstation-rc.yml'

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply uploaded RC source delta
        shell: bash
        run: |
          set -euo pipefail
          test -s .rc-publish/rc-source-delta.patch
          patch -s -p1 -d source < .rc-publish/rc-source-delta.patch
          grep -q 'MAX_VOICES=8' source/engine/synth.c
          grep -q 'id==168?8' source/app/app.c
          grep -q 'UNISON VOICES 1..8' source/README.md
          grep -q 'page==3?45:page==45?9' source/app/app.c
          test -f source/tests/panic_equiv_test.c
          test -f source/RC-RELEASE-NOTES.md
          test ! -f source/RC1-RELEASE-NOTES.md

      - name: Fetch validated JieLi toolchain
        shell: bash
        run: |
          set -euo pipefail
          URL='https://jl-update.oss-cn-shenzhen.aliyuncs.com/jieli-linux-toolchains-20260730.1.tar.xz'
          SHA='a1545cddbc451a06bac43eb5cd96d831470c42a97c5c0b1f98879a20fc7647bd'
          curl -fL --retry 4 --retry-delay 3 "$URL" -o /tmp/jieli-linux-toolchains.tar.xz
          echo "$SHA  /tmp/jieli-linux-toolchains.tar.xz" | sha256sum -c -
          mkdir -p /tmp/jieli
          tar --no-same-owner -xJf /tmp/jieli-linux-toolchains.tar.xz -C /tmp/jieli
          test -x /tmp/jieli/jieli-linux-toolchains-20260730.1/pi32v2/bin/clang

      - name: Build RC target from visible source
        shell: bash
        run: |
          set -euo pipefail
          export JIELI_TOOLCHAIN=/tmp/jieli/jieli-linux-toolchains-20260730.1
          (
            cd source
            bash build.sh
          )
          echo 'd08aa224eeed2855dce8860dc2bfb8cceae06d2ab58bb4f6172036e5d91ace92  source/app/build/vstation.bin' | sha256sum -c -
          echo 'b72cd34a82b834f5ddbd1ca69ac851d486417f4ee7a080289838efb7615cc229  source/release/FM1-VStation-RC.fwsc' | sha256sum -c -
          cp source/app/build/vstation.bin /tmp/vstation.bin
          cp source/release/FM1-VStation-RC.fwsc /tmp/FM1-VStation-RC.fwsc

      - name: Build and verify RC full M-Flasher image
        shell: bash
        run: |
          set -euo pipefail
          echo '9dd944c58d2ea155e93cee96805e6c72c86df7ff9ca998c1d35c0e78f91c5226  release/FM1-VStation-RC1-M-Flasher.bin' | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, sys
          root=Path('source')
          sys.path.insert(0,str(root/'base/tools'))
          import fm1pkg_make as pkg
          pkg.SDK=root/'build-deps/sdk'
          app=Path('/tmp/vstation.bin').read_bytes()
          flash=pkg.flash_image(app,pkg.KEY)
          image=bytearray(Path('release/FM1-VStation-RC1-M-Flasher.bin').read_bytes())
          if len(image)!=0x100000:
              raise SystemExit('unexpected RC1 full-image size')
          image[0x4000:0x93000]=flash[0x4000:0x93000]
          out=Path('/tmp/FM1-VStation-RC-M-Flasher.bin')
          out.write_bytes(image)
          app_sha=hashlib.sha256(app).hexdigest()
          image_sha=hashlib.sha256(image).hexdigest()
          expected='820b25f3607c338d36cdd0525029dced827fb2619b9445000fccbf4b4b7fe4a9'
          if image_sha!=expected:
              raise SystemExit(f'RC full-image hash mismatch: {image_sha}')
          report={
            "full_image_bytes":1048576,
            "application_bytes":573276,
            "application_slot_bytes":581564,
            "base_sha256":"ead915f71caff82d92e090da0b6912e910774fff950153fd4976f935937e6940",
            "application_sha256":app_sha,
            "image_sha256":image_sha,
            "changed_region_start":16384,
            "changed_region_end_exclusive":602112,
            "boot_region_preserved":True,
            "boot_validation":"exact bytes of the SHA256-pinned TEST81 backup",
            "all_bytes_after_application_preserved":True,
            "panel_calibration_preserved":True,
            "settings_preserved":True,
            "directory_crcs_valid":True,
            "decrypted_application_exact":True,
            "flashed_or_executed_on_hardware":False
          }
          Path('/tmp/FM1-VStation-RC-M-Flasher.json').write_text(json.dumps(report,indent=2)+"\n")
          PY
          echo '820b25f3607c338d36cdd0525029dced827fb2619b9445000fccbf4b4b7fe4a9  /tmp/FM1-VStation-RC-M-Flasher.bin' | sha256sum -c -
          echo 'fa1b1c0a590789f5af80775d7bea365dfcc9d5d0c6380dc02f00216617c6ba15  /tmp/FM1-VStation-RC-M-Flasher.json' | sha256sum -c -

      - name: Build host and run RC regressions
        shell: bash
        run: |
          set -euo pipefail
          export JIELI_TOOLCHAIN=/tmp/jieli/jieli-linux-toolchains-20260730.1
          (
            cd source
            bash build.sh --host
            python3 tests/source_consistency.py
            python3 tests/native_pool_ui_test.py
            python3 tests/preset_ui_test.py
            python3 tests/editor_protocol_test.py
            gcc -O2 -g -fsanitize=address,undefined -ffp-contract=off -DVSTATION_TARGET -DVSTATION_TEST -Iengine tests/native_poly_unison_test.c engine/*.c -lm -o /tmp/native_poly_unison_test
            ASAN_OPTIONS=detect_leaks=0 /tmp/native_poly_unison_test
          )

      - name: Package visible RC source and firmware
        shell: bash
        run: |
          set -euo pipefail
          rm -rf source/app/build source/release source/build-toolchain
          rm -f source/reference/FM1-PolyWavetable-TEST81-M-Flasher.bin
          find source -type d -name __pycache__ -prune -exec rm -rf {} +
          rm -rf source/tests/ui-output

          cp /tmp/FM1-VStation-RC.fwsc release/FM1-VStation-RC.fwsc
          cp /tmp/FM1-VStation-RC-M-Flasher.bin release/FM1-VStation-RC-M-Flasher.bin
          cp /tmp/FM1-VStation-RC-M-Flasher.json release/FM1-VStation-RC-M-Flasher.json

          rm -f release/FM1-VStation-RC-Source.zip release/FM1-VStation-RC-Web-Editor.zip
          (cd source && zip -qr -9 ../release/FM1-VStation-RC-Source.zip .)
          (cd source/web-editor && zip -qr -9 ../../release/FM1-VStation-RC-Web-Editor.zip .)

          cp source/README.md README.md
          cp source/DEPENDENCIES.md DEPENDENCIES.md
          cp source/build.sh build.sh
          cp source/RC-RELEASE-NOTES.md RC-RELEASE-NOTES.md
          rm -f RC1-RELEASE-NOTES.md

          (
            cd release
            sha256sum               FM1-VStation-RC-Source.zip               FM1-VStation-RC-Web-Editor.zip               FM1-VStation-RC.fwsc               FM1-VStation-RC-M-Flasher.bin               FM1-VStation-RC-M-Flasher.json               > SHA256SUMS.txt
          )

          rm -rf .rc-publish
          rm -f .github/workflows/export-current-source.yml
          rm -f .github/workflows/publish-rc1-device-gui.yml

      - name: Commit RC source and built firmware
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish V-Station RC: 8 voices, 8x unison, steal-path fixes' || exit 0
          git push
