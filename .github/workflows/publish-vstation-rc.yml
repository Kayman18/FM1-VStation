name: Publish FM1 V-Station RC

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-vstation-rc.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and publish the RC firmware
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          (cd release && sha256sum -c SHA256SUMS.txt)
          if gh release view RC >/dev/null 2>&1; then
            exit 0
          fi
          gh release create RC release/FM1-VStation-RC.fwsc \
            --target "$GITHUB_SHA" --title "FM1 V-Station RC" \
            --notes-file RC-RELEASE-NOTES.md --latest
