name: Export current RC1 source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-current-source.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: current-rc1-source
          path: release/FM1-VStation-RC1-Source.zip
          if-no-files-found: error
