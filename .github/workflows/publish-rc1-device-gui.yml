name: Publish RC1 device GUI source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-rc1-device-gui.yml'

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Expand baseline source and apply approved GUI
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/rc1src source
          mkdir -p /tmp/rc1src
          unzip -q release/FM1-VStation-RC1-Source.zip -d /tmp/rc1src
          if [[ -d /tmp/rc1src/app ]]; then
            SRC=/tmp/rc1src
          else
            SRC="$(find /tmp/rc1src -mindepth 1 -maxdepth 1 -type d | head -1)"
          fi
          mkdir -p source
          cp -a "$SRC"/. source/
          cp .rc1-gui-publish/apply_source_patch.py /tmp/apply_source_patch.py
          python3 /tmp/apply_source_patch.py

      - name: Fetch validated JieLi toolchain
        shell: bash
        run: |
          set -euo pipefail
          URL='https://jl-update.oss-cn-shenzhen.aliyuncs.com/jieli-linux-toolchains-20260730.1.tar.xz'
          SHA='a1545cddbc451a06bac43eb5cd96d831470c42a97c5c0b1f98879a20fc7647bd'
          curl -fL --retry 4 --retry-delay 3 "$URL" -o /tmp/jieli-linux-toolchains.tar.xz
          echo "$SHA  /tmp/jieli-linux-toolchains.tar.xz" | sha256sum -c -
          mkdir -p /tmp/jieli
          tar --no-same-owner -xJf /tmp/jieli-linux-toolchains.tar.xz -C /tmp/jieli
          test -x /tmp/jieli/jieli-linux-toolchains-20260730.1/pi32v2/bin/clang

      - name: Build and verify RC1 firmware
        shell: bash
        run: |
          set -euo pipefail
          export JIELI_TOOLCHAIN=/tmp/jieli/jieli-linux-toolchains-20260730.1
          (
            cd source
            bash build.sh
          )
          APP_SHA='d57646e15c451fe23bafbdffe3fd02fc881ee20d867ff1c1cab583b33a7b0f5e'
          FW_SHA='324c1b60b95c120e4dc171e7e23739612ba23f3ca66ec6be092fb8d80c0c0d11'
          echo "$APP_SHA  source/app/build/vstation.bin" | sha256sum -c -
          echo "$FW_SHA  source/release/FM1-VStation-RC1.fwsc" | sha256sum -c -
          cp source/app/build/vstation.bin /tmp/vstation.bin
          cp source/release/FM1-VStation-RC1.fwsc release/FM1-VStation-RC1.fwsc

      - name: Rebuild and verify full M-Flasher image
        shell: bash
        run: |
          set -euo pipefail
          cp .rc1-gui-publish/repack.py /tmp/repack.py
          python3 /tmp/repack.py

      - name: Run focused RC1 regressions
        shell: bash
        run: |
          set -euo pipefail
          export JIELI_TOOLCHAIN=/tmp/jieli/jieli-linux-toolchains-20260730.1
          (
            cd source
            bash build.sh --host
            python3 tests/source_consistency.py
            python3 tests/native_pool_ui_test.py
            python3 tests/preset_ui_test.py
            python3 tests/editor_protocol_test.py
          )

      - name: Regenerate downloadable source and editor archives
        shell: bash
        run: |
          set -euo pipefail
          rm -rf source/app/build source/release source/build-toolchain
          rm -f release/FM1-VStation-RC1-Source.zip release/FM1-VStation-RC1-Web-Editor.zip
          (cd source && zip -qr -9 ../release/FM1-VStation-RC1-Source.zip .)
          (cd source/web-editor && zip -qr -9 ../../release/FM1-VStation-RC1-Web-Editor.zip .)
          cp source/README.md README.md
          cp source/build.sh build.sh
          cp source/RC1-RELEASE-NOTES.md RC1-RELEASE-NOTES.md
          (
            cd release
            sha256sum               FM1-VStation-RC1-Source.zip               FM1-VStation-RC1-Web-Editor.zip               FM1-VStation-RC1.fwsc               FM1-VStation-RC1-M-Flasher.bin               > SHA256SUMS.txt
          )
          rm -rf .rc1-gui-publish

      - name: Commit browsable source and RC1 firmware
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'RC1: approved device GUI and splash' || exit 0
          git push
